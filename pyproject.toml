[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gigwatch-nova"
version = "0.3.0"
description = "Self-hosted freelance-gig watcher: monitor job feeds, filter by your skills, alert on new matches."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nova", email = "novagw@uberip.com" }]
keywords = ["freelance", "jobs", "gigs", "alerts", "monitor", "remote", "upwork"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
gigwatch = "gigwatch.cli:main"

[project.urls]
Homepage = "https://github.com/earnnova7/gigwatch"
Issues = "https://github.com/earnnova7/gigwatch/issues"

[tool.setuptools]
packages = ["gigwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that hit the network (deselected by default)"]
addopts = "-m 'not live'"
